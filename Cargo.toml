[package]
name         = "signal-aggregator"
version      = "0.5.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-aggregator"
description  = "Signal contract for aggregator evidence collection."
publish      = false

[lib]
name = "signal_aggregator"
path = "src/lib.rs"

[features]
default = ["dotos-text"]
dotos-text = ["dotos-text-query/dotos-text", "signal-frame/dotos-text"]

[dependencies]
dotos            = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "1facca44fbcb" }
dotos-text-query = { git = "https://github.com/LiGoldragon/dotos-text-query.git", branch = "main", default-features = false }
signal-frame    = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
rkyv            = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror       = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
